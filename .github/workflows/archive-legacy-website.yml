name: Archive former website files

on:
  push:
    paths:
      - ".github/workflows/archive-legacy-website.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project archive
        uses: actions/checkout@v4
        with:
          path: archive
          persist-credentials: true

      - name: Checkout current website
        uses: actions/checkout@v4
        with:
          repository: lcashish1/lcashish1.github.io
          ref: main
          path: website
          persist-credentials: false

      - name: Copy obsolete website directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p archive/legacy-website/.github/workflows
          rsync -a --exclude='*.swp' website/old website/html archive/legacy-website/
          rsync -a website/.github/ISSUE_TEMPLATE archive/legacy-website/.github/
          cp website/.github/workflows/import-technical-projects.yml archive/legacy-website/.github/workflows/

          while IFS= read -r -d '' source_file; do
            [[ "$source_file" == *.swp ]] && continue
            relative="${source_file#website/}"
            cmp "$source_file" "archive/legacy-website/$relative"
          done < <(find website/old website/html website/.github/ISSUE_TEMPLATE website/.github/workflows/import-technical-projects.yml -type f -print0)

          cat > archive/legacy-website/README.md <<'EOF'
          # Previous website files

          This folder preserves earlier website experiments and the retired portfolio migration workflow. The current professional portfolio is maintained at https://lcashish1.github.io/.

          Archived items:
          - `old/` — previous experimental HTML, CSS, JavaScript and PHP prototypes
          - `html/` — unused shared header/footer prototypes
          - `.github/ISSUE_TEMPLATE/` — unused issue templates from the former website
          - `.github/workflows/import-technical-projects.yml` — completed project migration maintenance script

          Temporary editor swap files (`*.swp`) were intentionally excluded; they are not usable project deliverables and can contain fragments of editor sessions. This archive is historical, not a running server-side application.
          EOF

      - name: Commit archived website files
        shell: bash
        run: |
          set -euo pipefail
          cd archive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- legacy-website/
          if git diff --cached --quiet; then
            echo "Legacy website archive already up to date."
          else
            git commit -m "Archive obsolete website folders and retired support files"
            git push origin HEAD:main
          fi
