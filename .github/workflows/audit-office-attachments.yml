name: Review portfolio Office attachments

on:
  push:
    paths:
      - ".github/workflows/audit-office-attachments.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out published portfolio sources
        uses: actions/checkout@v4
        with:
          repository: lcashish1/lcashish1.github.io
          ref: main
          path: site
          persist-credentials: false

      - name: Inspect embedded text in Word, PowerPoint and Excel files
        shell: bash
        run: |
          python3 - <<'PY'
          import re, zipfile, pathlib, xml.etree.ElementTree as ET
          root = pathlib.Path("site")
          files = sorted(p for p in root.rglob("*") if p.suffix.lower() in {".docx", ".pptx", ".xlsx"})
          patterns = {
              "named assistant": r"\b(?:ChatGPT|OpenAI|GPT[- ]?[345](?:\.\d+)?)\b",
              "generic assistant language": r"as an AI language model|generated by (?:an? )?(?:AI|ChatGPT)|written by (?:an? )?(?:AI|ChatGPT)",
              "placeholder copy": r"lorem ipsum|your text (?:goes )?here|insert (?:your )?text here",
          }
          count = 0
          for p in files:
              matches = []
              with zipfile.ZipFile(p) as z:
                  for member in z.namelist():
                      if not member.endswith(".xml"): continue
                      if not (member.startswith(("word/","ppt/slides/","xl/","docProps/"))): continue
                      try:
                          tree = ET.fromstring(z.read(member))
                      except ET.ParseError:
                          continue
                      raw = " ".join(el.text or "" for el in tree.iter() if el.text)
                      for label, regex in patterns.items():
                          if re.search(regex, raw, re.I):
                              matches.append((member,label))
              count += len(matches)
              print(f"{p}: {'no explicit assistant markers' if not matches else str(matches)}", flush=True)
          print(f"Office documents checked: {len(files)}; flagged occurrences: {count}", flush=True)
          if count:
              raise SystemExit(2)
          PY
